<h2>{{ producto and 'Editar' or 'Nuevo' }} Producto</h2>
<form method="post">
  <input name="nombre" value="{{ producto.nombre if producto else '' }}" placeholder="Nombre"><br>
  <input name="precio" value="{{ producto.precio if producto else '' }}" placeholder="Precio" type="number" step="0.01"><br>
  <input name="imagen" value="{{ producto.imagen if producto else '' }}" placeholder="URL Imagen"><br>
  <button type="submit">Guardar</button>
</form>
